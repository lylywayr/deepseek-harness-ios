name: Build request

description: Ask a question or propose an improvement

body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 issue。不要提交密码、Token、Cookie、证书、私有服务地址或个人数据。

  - type: textarea
    id: request
    attributes:
      label: Request
      description: What would you like to improve?
    validations:
      required: true
