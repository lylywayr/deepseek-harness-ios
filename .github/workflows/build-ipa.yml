name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEME: DeepSeekHarness
  CONFIGURATION: Release

jobs:
  build:
    name: Build iOS device IPA
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Verify protocol fixtures
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Verify native rework integration
        run: python3 scripts/verify_native_rework.py
      - name: Verify Pocket UI fixture
        run: python3 scripts/verify_native_ui_fixture.py
      - name: Run Swift protocol and Pocket regression tests
        run: |
          set -euo pipefail
          xcodebuild test -project DeepSeekHarness.xcodeproj -scheme DeepSeekHarness -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build unsigned device archive
        run: |
          set -euo pipefail
          xcodebuild archive -project DeepSeekHarness.xcodeproj -scheme "$SCHEME" -configuration "$CONFIGURATION" -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/DeepSeekHarness.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=''
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DeepSeekHarness.xcarchive/Products/Applications/DeepSeekHarness.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$GITHUB_WORKSPACE/DeepSeekHarness-unsigned.ipa"
      - name: Verify IPA artifact
        run: python3 scripts/verify_ipa.py DeepSeekHarness-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarness-unsigned-ipa
          path: DeepSeekHarness-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  native-ui-screenshots:
    name: Native Pocket UI screenshots matrix
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Build Debug simulator app
        run: |
          set -euo pipefail
          xcodebuild build -project DeepSeekHarness.xcodeproj -scheme DeepSeekHarness -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Capture Pocket screenshots
        run: |
          set -euo pipefail
          chmod +x scripts/capture_native_ui.sh
          scripts/capture_native_ui.sh
      - name: Upload Pocket screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pocket-v2-ui-matrix
          path: artifacts/pocket-v2-ui-matrix
          if-no-files-found: error
          retention-days: 14
